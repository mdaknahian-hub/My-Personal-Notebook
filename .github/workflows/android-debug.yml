name: Android debug APK

on:
  push:
    branches:
      - arena/01a0d731-my-personal-notebook
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test debug app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install API 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner."
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-output.log"
          GRADLE_STATUS=${PIPESTATUS[0]}
          if [ "$GRADLE_STATUS" -ne 0 ]; then
            {
              echo "### Gradle failed (last 80 lines)"
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/gradle-output.log" | cut -c1-500
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/gradle-output.log" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          numbered = [f"{number}: {line}" for number, line in enumerate(lines, 1)]
          if len("\n".join(numbered)) <= 12000:
              excerpt = "\n".join(numbered)
          else:
              failure_index = next((i for i, line in enumerate(lines) if "FAILURE:" in line), len(lines) - 1)
              start = max(0, failure_index - 25)
              end = min(len(lines), failure_index + 90)
              sections = numbered[:12] + ["... output elided ..."] + numbered[start:end] + ["... final lines ..."] + numbered[-25:]
              excerpt = "\n".join(sections)
              if len(excerpt) > 12000:
                  excerpt = excerpt[:8000] + "\n... middle elided ...\n" + excerpt[-3500:]
          excerpt = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle output::{excerpt}")
          PY
            exit "$GRADLE_STATUS"
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my-personal-notebook-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
