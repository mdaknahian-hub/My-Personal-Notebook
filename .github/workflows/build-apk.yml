# দোকান হিসাব — Android APK/AAB বিল্ড (PWA → TWA, Bubblewrap দিয়ে)
#
# কীভাবে চালাবেন: `apk-config.json`-এ হোস্ট করা PWA-র URL বসিয়ে push করুন —
# push-এর সাথে সাথেই বিল্ড শুরু হবে। (Actions UI থেকে হাতেও চালানো যায়।)
#
# ⚠️ সাইনিং কী: প্রথম রানে `android-signing/dokan-release.keystore` তৈরি হয়ে
# রিপোতেই কমিট হয়, পরের সব বিল্ড একই কী-তে সাইন হয় (আপডেট কাজ করে)।
# এই রিপো প্রাইভেট রাখুন — কী হারালে/ফাঁস হলে অ্যাপ আপডেট করা যাবে না।
# পাসওয়ার্ড নিচে KEYSTORE_PASSWORD-এ (বদলালে আগের কী বাতিল হয়ে যাবে!)

name: Build APK

on:
  push:
    branches:
      - arena/01a0dc24-my-personal-notebook
      - main
    paths:
      - apk-config.json
      - .github/workflows/build-apk.yml
      - scripts/apk/**
  workflow_dispatch:
    inputs:
      url:
        description: "হোস্ট করা PWA-র URL (https://...) — খালি রাখলে apk-config.json থেকে নেবে"
        required: false
        type: string
      version:
        description: "ভার্সন নাম (যেমন 1.0.0)"
        required: false
        default: ""
        type: string
      package_id:
        description: "Android Package ID"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  KEYSTORE_FILE: android-signing/dokan-release.keystore
  KEY_ALIAS: dokan
  # --- সাইনিং পাসওয়ার্ড (৬+ অক্ষর হতে হবে) ---
  BUBBLEWRAP_KEYSTORE_PASSWORD: DokanHishab-2026-Sign
  BUBBLEWRAP_KEY_PASSWORD: DokanHishab-2026-Sign

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড নিন
        uses: actions/checkout@v4

      - name: কনফিগ পড়ুন (apk-config.json)
        id: cfg
        run: |
          URL="${{ inputs.url }}"
          VER="${{ inputs.version }}"
          PKG="${{ inputs.package_id }}"
          [ -z "$URL" ] && URL=$(jq -r .url apk-config.json)
          [ -z "$VER" ] && VER=$(jq -r .version apk-config.json)
          [ -z "$PKG" ] && PKG=$(jq -r .package_id apk-config.json)
          MANIFEST=$(jq -r '.manifest // "/manifest.webmanifest"' apk-config.json)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "package_id=$PKG" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "URL=$URL  manifest=$MANIFEST  version=$VER  package=$PKG"

      - name: JDK 17 বসান
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 22 বসান
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bubblewrap CLI ইনস্টল
        run: npm --prefix scripts/apk install --no-save @bubblewrap/cli

      - name: TWA প্রজেক্ট তৈরি
        run: |
          set +e
          node scripts/apk/generate-twa.mjs \
            --url "${{ steps.cfg.outputs.url }}" \
            --manifest-path "${{ steps.cfg.outputs.manifest }}" \
            --out twa \
            --package-id "${{ steps.cfg.outputs.package_id }}" \
            --version-name "${{ steps.cfg.outputs.version }}" \
            --version-code "${{ github.run_number }}" \
            --keystore "$KEYSTORE_FILE" \
            --key-alias "$KEY_ALIAS" 2>&1 | tee twa-gen.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "## TWA জেনারেটর ব্যর্থ (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            tail -30 twa-gen.log | sed 's/^/::error::/' || true
          fi
          exit "$code"

      - name: সাইনিং কী রিপোতে সংরক্ষণ (প্রথমবার)
        run: |
          git config user.name "apk-builder[bot]"
          git config user.email "apk-builder[bot]@users.noreply.github.com"
          git add -f "$KEYSTORE_FILE"
          if git diff --cached --quiet; then
            echo "আগের কী-ই আছে — কমিট লাগবে না"
          else
            git commit -m "প্রথম APK সাইনিং কী সংরক্ষণ (আপডেটের জন্য রাখুন!)"
            git push
          fi

      - name: Android SDK প্রস্তুত (build-tools 36 + পাথ ঠিক করা)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.1.0" "platforms;android-36" 2>&1 | tail -3
          # Bubblewrap SDK রুটে tools/ বা bin/ ফোল্ডার আশা করে — symlink দিয়ে মেলান
          mkdir -p bw-sdk
          ln -sfn "$ANDROID_HOME/build-tools" bw-sdk/build-tools
          ln -sfn "$ANDROID_HOME/platforms" bw-sdk/platforms
          ln -sfn "$ANDROID_HOME/platform-tools" bw-sdk/platform-tools
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" bw-sdk/tools
          [ -d "$ANDROID_HOME/licenses" ] && ln -sfn "$ANDROID_HOME/licenses" bw-sdk/licenses || true
          ls bw-sdk/
          printf '{"jdkPath":"%s","androidSdkPath":"%s/bw-sdk"}' "$JAVA_HOME" "$PWD" > bw-config.json
          cat bw-config.json

      - name: APK + AAB বিল্ড
        run: |
          set +e
          ./scripts/apk/node_modules/.bin/bubblewrap build \
            --manifest ./twa/twa-manifest.json \
            --directory ./twa \
            --config ./bw-config.json 2>&1 | tee bw-build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "## Bubblewrap বিল্ড ব্যর্থ (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error|fail|exception" bw-build.log | tail -20 | sed 's/^/::error::/' || true
          fi
          exit "$code"

      - name: SHA-256 ফিঙ্গারপ্রিন্ট বের করুন
        id: fp
        run: |
          "$JAVA_HOME/bin/keytool" -list -v \
            -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | tee fingerprints.txt
          SHA256=$(grep -m1 "SHA256:" fingerprints.txt | awk '{print $2}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"%s","sha256_cert_fingerprints":["%s"]}}]' \
            "${{ steps.cfg.outputs.package_id }}" "$SHA256" > assetlinks.json
          echo "ফিঙ্গারপ্রিন্ট: $SHA256"

      - name: আর্টিফ্যাক্ট আপলোড (APK/AAB)
        uses: actions/upload-artifact@v4
        with:
          name: dokan-hishab-v${{ steps.cfg.outputs.version }}-${{ github.run_number }}
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
            fingerprints.txt
            assetlinks.json
          retention-days: 30

      - name: GitHub Release তৈরি
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v${{ steps.cfg.outputs.version }}-${{ github.run_number }}"
          ARGS=(--title "দোকান হিসাব $TAG")
          case "${{ steps.cfg.outputs.version }}" in
            *test*) ARGS+=(--prerelease --notes "পরীক্ষামূলক বিল্ড — আসল হিসাবে ব্যবহার করবেন না।") ;;
            *) ARGS+=(--notes "APK ফোনে ইনস্টল করুন। SHA-256: ${{ steps.fp.outputs.sha256 }}") ;;
          esac
          gh release create "$TAG" "${ARGS[@]}" \
            twa/app-release-signed.apk \
            twa/app-release-bundle.aab \
            fingerprints.txt \
            assetlinks.json
