# Render Blueprint — এক-ক্লিকে ডিপ্লয় ("Deploy to Render" বাটনে চাপ দিলেই চলবে)
# ডক্স: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dokan-hishab
    runtime: docker
    # Free প্ল্যান ($০): ডিস্ক নেই — রিডিপ্লয়/রিস্টার্টে SQLite ডেটা মুছবে,
    # আর ১৫ মিনিট অব্যবহৃত থাকলে সার্ভার ঘুমায় (প্রথম লোডে ~১ মিনিট লাগে)।
    # আসল দোকানে চালাতে চাইলে plan: starter + নিচের disk অংশ ফিরিয়ে দিন।
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: /data/dokan.db
